name: 持仓关键位云端监控

on:
  schedule:
    # UTC 时间 = 北京时间 - 8小时（交易日周一至周五）
    # 01:45=北京9:45, 04:00=北京12:00, 06:00=北京14:00, 08:10=北京16:10
# 北京时间 = UTC + 8，以下已换算
    - cron: '45 1 * * 1-5'   # UTC 01:45 = 北京 09:45
    - cron: '0 4 * * 1-5'    # UTC 04:00 = 北京 12:00
    - cron: '0 6 * * 1-5'    # UTC 06:00 = 北京 14:00
    - cron: '10 8 * * 1-5'   # UTC 08:10 = 北京 16:10
  workflow_dispatch: {}   # 支持手动触发（GitHub 网页上点 Run workflow 可立即测试）

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行持仓监控并推送微信
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python3 monitor.py
