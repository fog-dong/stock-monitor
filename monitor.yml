name: 持仓关键位云端监控

on:
  schedule:
    # UTC 时间 = 北京时间 - 8小时：02:30=10:30, 06:30=14:30, 08:30=16:30（交易日周一至周五）
    - cron: '30 2,6,8 * * 1-5'
  workflow_dispatch: {}   # 支持手动触发（GitHub 网页上点 Run workflow 可立即测试）

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行持仓监控并推送微信
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python3 monitor.py
